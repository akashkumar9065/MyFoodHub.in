<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="indexImage/foodhub.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoodHub | Our Menu</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>

        <nav id="navbar">

            <div class="logo">
                <a href="index.html" style="display: flex; align-items: center; text-decoration: none; gap: 8px;">
                    <img src="indexImage/foodhub.png" alt="FoodHub Logo" style="height: 60px; width: auto;">
                    <h2 style="margin: 0; color: #ff4757;">FoodHub</h2>
                </a>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="menu.html" class="active">Menu</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>

        </nav>

    </header>


    <!-- ================= MENU TITLE ================= -->

    <section class="menu-header">

        <h1>Our Delicious Menu</h1>

        <p>
            Choose your favourite restaurant and enjoy delicious food.
        </p>

    </section>


    <!-- ================= SEARCH ================= -->

    <section class="menu-search">

        <div class="search-box">

            <input type="text" id="searchBox" placeholder="Search food or restaurant..." autocomplete="off" aria-label="Search food or restaurant">

            <button id="searchBtn" type="button" aria-label="Search">
                <i class="fa-solid fa-search"></i>
            </button>

        </div>

        <p id="menuSearchStatus" class="menu-search-status" aria-live="polite"></p>

    </section>


    <!-- ================= DYNAMIC RESTAURANTS & MENUS CONTAINER ================= -->
    <div id="dynamicMenuContainer">
        <div style="text-align: center; width: 100%; padding: 40px;">
            <p style="color: #777; font-size: 16px;">Loading Restaurants & Menus...</p>
        </div>
    </div>


    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-logo">
            🍔 FoodHub
        </div>

        <p>
            Fresh Food • Fast Delivery • Best Taste
        </p>

        <p>
            © 2026 FoodHub. All Rights Reserved.
        </p>

    </footer>


    <!-- ================= SCRIPTS ================= -->

    <script src="toast.js"></script>
    <script type="module" src="cart-manager.js"></script>
    <script src="script.js"></script>
    <script src="bottom-nav.js"></script>
    <script type="module" src="live-menu.js"></script>
</body>

</html>
